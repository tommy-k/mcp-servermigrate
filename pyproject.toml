[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-servermigrate"
version = "0.1.0"
description = "MCP Agent and Server for RHEL/Fedora System Migration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "paramiko>=3.4.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0"
]

[project.scripts]
mcp-servermigrate = "mcp_servermigrate.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_servermigrate"]
